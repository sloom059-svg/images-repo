name: Publish Curated SmartTube APK
on:
  push:
    paths:
      - '.github/workflows/publish-smarttube-curated.yml'
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Fetch verified built SmartTube APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p bundle
          gh run download 43136639171 -R sloom059-svg/images-repo -n SmartTube-Curated-Debug -D bundle
          echo "APK files:"
          find bundle -type f -name '*.apk' -print
          test "$(find bundle -type f -name '*.apk' | wc -l)" -ge 1
          apk="$(find bundle -type f -name '*_universal.apk' | head -1)"
          test -n "$apk"
          cp "$apk" SmartTube-Qanawati-v3.apk
          test -s SmartTube-Qanawati-v3.apk
          python3 -c 'import zipfile; m=zipfile.ZipFile("SmartTube-Qanawati-v3.apk").read("AndroidManifest.xml"); assert "org.smarttube.curated".encode("utf-16le") in m'
      - name: Publish public direct download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create smarttube-qanawati-v3 SmartTube-Qanawati-v3.apk -R sloom059-svg/images-repo \
            --title "قنواتي SmartTube v3 - One APK" \
            --notes "Built from the original open-source yuliskov/SmartTube code (MIT). Home launches only selected channel videos from curated-tv/channels.json; Music/Trending and random browse sections removed. Original search, player and thumbnails are retained. This independently built modification is not an official SmartTube release. On-device testing is recommended."
