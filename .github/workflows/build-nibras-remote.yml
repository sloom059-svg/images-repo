name: Build Nibras Remote APK
on:
  push:
    branches: [main]
    paths:
      - 'nibras-remote/**'
      - '.github/workflows/build-nibras-remote.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'nibras-remote/**'
      - '.github/workflows/build-nibras-remote.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android 9+ APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout custom interface
        uses: actions/checkout@v4

      - name: Checkout Webmote Android source
        uses: actions/checkout@v4
        with:
          repository: maxhayim/webmote
          path: upstream

      - name: Apply custom Arabic interface
        run: |
          test -s nibras-remote/index.html
          test -f upstream/app/src/main/assets/index.html
          cp nibras-remote/index.html upstream/app/src/main/assets/index.html
          echo "Arabic interface copied into Android app."

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build platform
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Build release APK
        working-directory: upstream
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace --console=plain assembleRelease 2>&1 | tee ../build-output.log

      - name: Prepare verified APK
        shell: bash
        run: |
          mkdir -p output
          find upstream/app/build/outputs/apk -name '*.apk' -type f -print
          APK="$(find upstream/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f -print -quit)"
          test -n "$APK"
          test -s "$APK"
          cp "$APK" output/Nibras-Remote.apk
          unzip -t output/Nibras-Remote.apk | tail -2
          ls -lh output/Nibras-Remote.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nibras-Remote-APK
          path: output/Nibras-Remote.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Nibras-Remote-Build-Logs
          path: build-output.log
          if-no-files-found: ignore
          retention-days: 7
