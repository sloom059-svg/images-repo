name: Build Curated SmartTube from Official Source
on:
  workflow_dispatch:
  push:
    paths:
      - 'smarttube-custom/**'
      - '.github/workflows/build-smarttube-curated.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - name: Checkout customization only
        uses: actions/checkout@v4
        with:
          sparse-checkout: smarttube-custom
      - name: Get official SmartTube source
        run: |
          git clone --filter=blob:none --recursive https://github.com/yuliskov/SmartTube.git SmartTube
          cd SmartTube
          git checkout 481059fe18f4504e7b8314a682406bf64f1665c0
          git submodule update --init --recursive
      - name: Patch home recommendations
        run: python3 smarttube-custom/patch_smarttube.py
      - name: Use compatible JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Prepare Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-33" "build-tools;33.0.2" || true
      - name: Build original SmartTube APK with curated Home
        working-directory: SmartTube
        run: |
          chmod +x gradlew
          ./gradlew :smarttubetv:assembleStstableDebug --no-daemon --stacktrace
      - name: Keep exactly one universal APK
        run: |
          src="$(find SmartTube/smarttubetv/build/outputs/apk -type f -name '*_universal.apk' | head -n 1)"
          test -n "$src"
          cp "$src" YouTube-Me-v5.apk
          test -s YouTube-Me-v5.apk
          python3 -c 'import zipfile; m=zipfile.ZipFile("YouTube-Me-v5.apk").read("AndroidManifest.xml"); assert "org.smarttube.curated".encode("utf-16le") in m, "wrong app package"'
      - name: Publish one direct APK download (no ZIP)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create youtube-me-v5 YouTube-Me-v5.apk \
            -R sloom059-svg/images-repo \
            --target "${GITHUB_SHA}" \
            --title "YouTube Me v5 — SmartTube player and native search autocomplete" \
            --notes "YouTube Me app with YouTube-style icon and Android TV banner, native SmartTube search suggestions, right sidebar, native player with back arrow and no below-video suggestions. One universal APK."
