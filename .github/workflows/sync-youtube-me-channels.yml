name: Sync YouTube Me Channels from Telegram Bot
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - ".github/workflows/sync-youtube-me-channels.yml"
      - "scripts/sync_youtube_me_channels.py"
permissions:
  contents: write
concurrency:
  group: youtube-me-channel-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import newly approved channels
        run: python3 scripts/sync_youtube_me_channels.py
      - name: Commit additions to existing live channel list
        run: |
          if git diff --quiet -- curated-tv/channels.json; then
            echo "Already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add curated-tv/channels.json
          git commit -m "Sync YouTube Me channels added through Telegram"
          git push
