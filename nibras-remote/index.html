<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>ريموت نبراس</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:white;color:#141414;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;color:#151515}button:active{filter:brightness(.91);transform:scale(.98)}button:disabled{opacity:.5}.shell{max-width:450px;margin:auto;height:100dvh;min-height:520px;max-height:960px;display:flex;flex-direction:column;padding:clamp(8px,1.3vh,16px) 13px max(8px,env(safe-area-inset-bottom));gap:clamp(6px,1.1vh,10px);overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;min-height:27px}.top strong{font-size:17px}.status{font-size:11px;color:#777}.dot{display:inline-block;width:8px;height:8px;background:#c3c3c3;border-radius:50%;margin-left:5px}.dot.online{background:#19a16b}.apps{display:grid;grid-template-columns:1fr 1fr;gap:9px;flex-shrink:0}.apps button{border-radius:19px;height:clamp(78px,14vh,121px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:clamp(15px,2.4vh,20px);font-weight:750}.apps small{font-size:11px;font-weight:400;color:#777}.pink{background:#f5e3e7}.mint{background:#e1efed}.ico{font-size:26px;line-height:1.1}.back{background:#f0f0f0;border-radius:15px;height:clamp(41px,6.6vh,56px);flex-shrink:0;font-weight:750;font-size:17px}.controls{display:grid;grid-template-columns:1fr 2fr 1fr;gap:8px;flex:1;min-height:160px;max-height:290px}.side{display:flex;flex-direction:column;gap:7px;min-height:0}.side button{flex:1;min-height:0;border-radius:14px;background:#f1f1f1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;font-size:12px}.side svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.side .symbol{font-size:23px}.dpad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:5px}.dpad button{background:#f1f1f1;border-radius:12px;font-size:21px;font-weight:600}.dpad .empty{background:transparent;pointer-events:none}.dpad .ok{background:#dceae8;font-size:17px}.media{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex-shrink:0}.media button{background:#f0f0f0;border-radius:13px;height:clamp(41px,6.5vh,55px);font-size:22px}.type{background:#eeeeee;border-radius:15px;height:clamp(41px,7vh,54px);flex-shrink:0;font-weight:650}.bottom{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex-shrink:0}.bottom button{background:#f1f1f1;border-radius:12px;height:clamp(35px,5.6vh,47px);font-size:12px}.message{font-size:11px;text-align:center;color:#777;min-height:15px}.hidden{display:none!important}.cover{position:fixed;inset:0;background:#ffffffee;z-index:20;display:flex;align-items:center;justify-content:center;padding:22px}.dialog{width:min(100%,380px);background:#fff;border:1px solid #e7e7e7;border-radius:23px;box-shadow:0 10px 40px #0002;padding:22px;text-align:center}.dialog h2{margin:0 0 10px;font-size:21px}.dialog p{color:#777;font-size:13px}.dialog input{width:100%;border:1px solid #ddd;border-radius:12px;padding:13px;direction:ltr;text-align:center;margin:10px 0}.dialog button{background:#dceae8;border-radius:12px;padding:12px 20px;font-weight:700}.dialog .small{background:#f1f1f1;margin:5px}.sheet{position:fixed;inset:0;z-index:15;background:#0007;display:flex;align-items:end}.sheetBody{width:100%;max-width:450px;margin:auto;background:white;border-radius:22px 22px 0 0;padding:20px;max-height:80vh;overflow:auto}.sheetBody h3{margin:0 0 12px}.appRow{display:block;width:100%;background:#f2f2f2;padding:12px;margin:6px 0;border-radius:11px;text-align:right}@media(max-height:610px){.shell{gap:5px}.apps button{height:75px}.back{height:38px}.media button{height:37px}.type{height:38px}.bottom button{height:34px}}
</style></head><body>
<main id="remote" class="shell hidden">
<header class="top"><strong>ريموت نبراس</strong><span class="status"><span id="dot" class="dot"></span><span id="connection">جارٍ الاتصال</span></span></header>
<section class="apps">
<button class="mint" data-app="نِبراس"><span class="ico">☻</span>نبراس كيدز<small>فتح مباشر</small></button>
<button class="pink" data-app="YouTube Me"><span class="ico">▣</span>YouTube Me<small>فتح مباشر</small></button>
</section><button class="back" data-key="back">↩ &nbsp; رجوع</button>
<section class="controls">
<div class="side"><button data-key="power"><span class="symbol">⏻</span>الطاقة</button><button data-key="home"><span class="symbol">⌂</span>الرئيسية</button><button data-extra="apps"><span class="symbol">▦</span>التطبيقات</button></div>
<div class="dpad">
<div class="empty"></div><button data-key="up">▲</button><div class="empty"></div>
<button data-key="right">◀</button><button class="ok" data-key="ok">OK</button><button data-key="left">▶</button>
<div class="empty"></div><button data-key="down">▼</button><div class="empty"></div>
</div>
<div class="side"><button data-key="vol_up"><span class="symbol">＋</span>رفع الصوت</button><button data-key="mute"><svg viewBox="0 0 24 24" aria-label="كتم الصوت"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m17 9 5 6m0-6-5 6"/></svg>كتم</button><button data-key="vol_down"><span class="symbol">−</span>خفض الصوت</button></div>
</section>
<section class="media"><button data-key="next" title="التالي">⏭</button><button data-key="play_pause" title="تشغيل وإيقاف">⏯</button><button data-key="previous" title="السابق">⏮</button><button data-key="off" title="إيقاف الشاشة">⏹</button></section>
<button class="type" data-extra="keyboard">⌨ &nbsp; الكتابة من الآيفون</button>
<section class="bottom"><button data-key="settings">⚙ الإعدادات</button><button data-extra="search">⌕ بحث</button><button data-extra="apps">▦ بقية التطبيقات</button></section>
<div class="message" id="message" aria-live="polite"></div></main>
<section class="cover" id="pairScreen"><div class="dialog"><h2>📺 ريموت نبراس</h2><p>افتح التطبيق في شاومي واكتب الرقم السري المكوّن من 6 أرقام</p><input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"><button id="pairButton">اتصال بالتلفزيون</button><p id="pairMessage"></p><button id="showPin" class="small">إظهار الرمز على التلفزيون</button></div></section>
<div id="sheet" class="sheet hidden"><div class="sheetBody"><h3 id="sheetTitle"></h3><div id="sheetContent"></div><button class="appRow" id="closeSheet">إغلاق</button></div></div>
<script>
(function(){
const $=id=>document.getElementById(id), KEY='nibras-remote-auth-key', saved=()=>{try{return localStorage.getItem(KEY)}catch(e){return null}};
let token=saved(), installed=[], lastScreen=true;
function note(t){$('message').textContent=t||''}
async function request(path,body,authenticate=true){const options={headers:{'Content-Type':'application/json'}};if(authenticate&&token)options.headers['X-Webmote-Key']=token;if(body!==undefined){options.method='POST';options.body=JSON.stringify(body)}const response=await fetch(path,options);if(response.status===401){logout();throw Error('انتهى الاقتران، أعد إدخال الرمز')}const data=await response.json().catch(()=>({}));if(!response.ok||data.ok===false)throw Error(data.error||'تعذر تنفيذ الأمر');return data}
function logout(){token=null;try{localStorage.removeItem(KEY)}catch(e){}$('pairScreen').classList.remove('hidden');$('remote').classList.add('hidden')}
function connected(yes){$('dot').classList.toggle('online',yes);$('connection').textContent=yes?'متصل بالشاومي':'غير متصل'}
async function refresh(){if(!token)return;try{const st=await request('/api/status');lastScreen=st.screen!==false;connected(true)}catch(e){connected(false)}}
function showRemote(){$('pairScreen').classList.add('hidden');$('remote').classList.remove('hidden');refresh();loadApps()}
async function pair(){let pin=$('pin').value.replace(/\D/g,'').slice(0,6);if(pin.length!==6){$('pairMessage').textContent='أدخل 6 أرقام';return}try{let x=await request('/api/pair',{pin},false);if(!x.key)throw Error(x.error||'رمز غير صحيح');token=x.key;try{localStorage.setItem(KEY,token)}catch(e){}showRemote()}catch(e){$('pairMessage').textContent=e.message}}
async function loadApps(){try{installed=await request('/api/apps')}catch(e){}}
async function key(k){try{const data=await request('/api/key',{key:k});note('تم تنفيذ الأمر');if(k==='power')lastScreen=!lastScreen}catch(e){note(e.message)}}
async function launch(name){if(!installed.length)await loadApps();const normal=s=>(s||'').toLowerCase().replace(/[^a-z0-9\u0600-\u06ff]/g,'');const found=installed.find(a=>normal(a.label)===normal(name))||installed.find(a=>normal(a.label).includes(normal(name)))||installed.find(a=>normal(a.label).includes('nibras')&&name==='نِبراس')||installed.find(a=>normal(a.label).includes('youtube me')&&name==='YouTube Me');if(!found){note('لم أجد التطبيق؛ افتح قائمة التطبيقات واختَره');openApps();return}try{await request('/api/launch',{pkg:found.pkg});note('تم فتح '+found.label)}catch(e){note(e.message)}}
function openSheet(title,html){$('sheetTitle').textContent=title;$('sheetContent').innerHTML=html;$('sheet').classList.remove('hidden')}
function closeSheet(){$('sheet').classList.add('hidden')}
async function openApps(){if(!installed.length)await loadApps();openSheet('التطبيقات','');const box=$('sheetContent');if(!installed.length){box.textContent='تعذر جلب التطبيقات';return}installed.forEach(a=>{const b=document.createElement('button');b.className='appRow';b.textContent=a.label;b.onclick=async()=>{closeSheet();try{await request('/api/launch',{pkg:a.pkg});note('تم فتح '+a.label)}catch(e){note(e.message)}};box.appendChild(b)})}
function keyboard(search){openSheet(search?'بحث في التلفزيون':'الكتابة من الآيفون','<input id="words" placeholder="اكتب النص..." style="width:100%;padding:14px;border:1px solid #ccc;border-radius:12px"><button id="sendWords" class="appRow">إرسال</button>');$('sendWords').onclick=async()=>{const words=$('words').value;try{await request('/api/text',{text:words,enter:!!search});note('تم إرسال النص');closeSheet()}catch(e){note(e.message)}};$('words').focus()}
document.querySelectorAll('[data-key]').forEach(b=>b.addEventListener('click',()=>key(b.dataset.key)));
document.querySelectorAll('[data-app]').forEach(b=>b.addEventListener('click',()=>launch(b.dataset.app)));
document.querySelectorAll('[data-extra]').forEach(b=>b.addEventListener('click',()=>b.dataset.extra==='apps'?openApps():keyboard(b.dataset.extra==='search')));
$('closeSheet').onclick=closeSheet;$('sheet').addEventListener('click',e=>{if(e.target===$('sheet'))closeSheet()});$('pairButton').onclick=pair;$('pin').oninput=e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,6)};$('showPin').onclick=()=>request('/api/pair/show',{},false).catch(()=>{});$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')pair()});if(token)showRemote();else logout();setInterval(refresh,7000);
})();
</script></body></html>
